<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Inventario de juegos - PS5, PS4, Nintendo, Xbox" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Inventario Juegos</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- SheetJS for Excel import/export -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <h1>🎮 Inventario</h1>
        <div class="header-actions">
          <button id="exportBtn" class="btn-action" title="Exportar Excel">📥 Excel</button>
          <label class="btn-action btn-import" title="Importar Excel">
            📤 Importar
            <input type="file" id="importInput" accept=".xlsx,.xls,.csv" hidden />
          </label>
          <button id="installBtn" class="btn-install hidden" title="Instalar app">⬇️ Instalar</button>
        </div>
      </div>
      <div class="currency-bar">
        <label>
          1 USD =
          <input type="number" id="rateInput" value="6.96" min="0" step="0.01" />
          BOB
        </label>
        <label class="ajuste-label" title="Suma fija en bolivianos al precio mostrado">
          + Bs
          <input type="number" id="ajusteBobInput" value="0" min="0" step="1" />
        </label>
      </div>
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="Buscar por inicio del nombre..." autocomplete="off" />
        <button id="clearSearch" class="btn-clear hidden" aria-label="Limpiar">✕</button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <!-- Generated by JS -->
    </nav>

    <main class="content" id="content">
      <div class="loading">Cargando inventario...</div>
    </main>

    <footer class="footer">
      <span id="stats"></span>
    </footer>
  </div>

  <!-- Modal editar -->
  <div id="editModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="modalTitle">Editar producto</h2>
        <button type="button" class="btn-close-modal" id="closeModal" aria-label="Cerrar">✕</button>
      </div>
      <form id="editForm" class="modal-body">
        <input type="hidden" id="editPlatform" />
        <input type="hidden" id="editIndex" />
        <label class="field">
          <span>Nombre</span>
          <input type="text" id="editNombre" required autocomplete="off" />
        </label>
        <label class="field">
          <span>Unidades</span>
          <input type="number" id="editCantidad" min="0" step="1" required />
        </label>
        <label class="field">
          <span>Precio (USD)</span>
          <input type="number" id="editPrecio" min="0" step="0.01" placeholder="Vacío = sin precio" />
        </label>
        <p class="modal-hint" id="editBobPreview">Bs —</p>
        <div class="modal-actions">
          <button type="button" class="btn-danger" id="deleteBtn">Eliminar</button>
          <div class="modal-actions-right">
            <button type="button" class="btn-secondary" id="cancelEdit">Cancelar</button>
            <button type="submit" class="btn-primary">Guardar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
